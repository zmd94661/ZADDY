<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login — ZADDY</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
  <div class="min-h-screen flex items-center justify-center">
    <div class="w-full max-w-md bg-white rounded-2xl shadow p-8">
      <h1 class="text-2xl font-extrabold text-center mb-6">Login</h1>
      <form>
        <label class="block text-sm mb-1">Email</label>
        <input class="w-full border rounded-lg p-3 mb-4" type="email" placeholder="you@example.com" />
        <label class="block text-sm mb-1">Password</label>
        <input class="w-full border rounded-lg p-3 mb-6" type="password" placeholder="••••••••" />
        <button type="button" onclick="alert('Demo only')" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-3 rounded-lg">Login</button>
      </form>
      <p class="text-center text-sm mt-4">No account? <a href="signup.html" class="text-blue-600">Sign up</a></p>
    </div>
  </div>
</body>
</html>
